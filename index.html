<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wurzelwissenschaft</title>
    <style>
      :root {
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #1f2937;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      .empty {
        max-width: 640px;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        margin: 0;
        font-size: 1rem;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="empty">
        <h1>Wurzelwissenschaft</h1>
        <p>Leerer Startpunkt. Du kannst hier später deine Dateien hochladen.</p>
      </div>
    </main>
  </body>
</html>
